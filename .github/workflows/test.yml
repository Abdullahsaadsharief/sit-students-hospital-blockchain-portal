name: Security & Integrity Test Suite

on:
  push:
    branches: [ main, security-hardening ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies cleanly from lockfile
        run: npm ci

      - name: Compile Ethereum Smart Contract (Solidity)
        run: node scripts/deploy-contract.js --compile-only

      - name: Run full security & API regression suite
        run: npm test
