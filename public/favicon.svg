<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f223d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
  <!-- Rounded hospital shield badge -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#bg)" stroke="#14b8a6" stroke-width="3.5"/>
  <!-- Clean white medical cross -->
  <rect x="26" y="13" width="12" height="32" rx="3" fill="#ffffff"/>
  <rect x="16" y="23" width="32" height="12" rx="3" fill="#ffffff"/>
  <!-- Teal accent bar (SIT Hospital signature color) -->
  <rect x="16" y="49" width="32" height="4.5" rx="2.25" fill="url(#accent)"/>
</svg>
